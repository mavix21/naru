  - "app-lib"
  - "app-lib/clients/*"
  - "backend"
  - "contracts"
allowBuilds:
  "@reown/appkit": false
  bufferutil: true
  esbuild: true
  secp256k1: true
  unrs-resolver: true
  utf-8-validate: true
minimumReleaseAgeExclude:
